<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0b08a">
<meta name="robots" content="noindex">
<title>Jasmine</title>
<style>
:root{--bg:#dea6f0;--ink:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hero{position:relative;height:46vh;min-height:330px;max-height:480px;background:#222}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 45%,rgba(222,166,240,.55) 80%,var(--bg) 100%)}
.id{position:absolute;left:0;right:0;bottom:26px;z-index:1;text-align:center}
.name{display:inline-flex;align-items:center;gap:10px;margin:0;font-size:clamp(44px,13vw,64px);font-weight:800;letter-spacing:-.5px;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.name svg{width:.5em;height:.5em;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 14px 6px 10px;background:#fff;color:#222;border-radius:999px;font-weight:600;font-size:17px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.dot{width:16px;height:16px;border-radius:50%;background:#4cd964;box-shadow:0 0 0 0 rgba(76,217,100,.7);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 8px rgba(76,217,100,0)}100%{box-shadow:0 0 0 0 rgba(76,217,100,0)}}
.links{padding:14px 16px 30px;display:flex;flex-direction:column;gap:18px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:185px;border-radius:44px;overflow:hidden;border:4px solid #777;text-decoration:none;color:#fff;box-shadow:0 0 22px rgba(140,110,255,.55);background:#222 center 30%/cover no-repeat;transition:transform .15s}
.card:active{transform:scale(.97)}
.card::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.12)}
.card b,.card span{position:relative;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.card b{font-size:27px}
.card span{font-size:19px;opacity:.85;margin-top:2px}
.foot{margin-top:auto;text-align:center;padding:10px 0 24px;font-size:13px;color:rgba(255,255,255,.55)}
